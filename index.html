*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#f6f8f3;color:#1a3328;line-height:1.7}
.header{background:#0f3d2e;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.header h1{font-size:20px;font-weight:800}

.hero{background:linear-gradient(135deg,#0f3d2e 0%,#1e6b4a 50%,#2e8b62 100%);color:#fff;padding:70px 24px 90px;text-align:center}
.hero h2{font-size:40px;font-weight:900;margin-bottom:14px}
.hero p{opacity:.95;font-size:18px;max-width:650px;margin:0 auto 28px;line-height:1.8}
.btn{background:#e8f5c8;color:#0f3d2e;padding:14px 32px;border-radius:30px;font-weight:800;border:none;cursor:pointer;font-size:16px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;padding:0 24px;max-width:1150px;margin:-30px auto 40px;position:relative;z-index:2}

.card h3{color:#0f3d2e;margin-bottom:10px;font-size:19px}
.card p{color:#5a6d62;font-size:14.5px}
